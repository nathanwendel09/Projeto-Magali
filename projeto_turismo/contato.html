<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | Turismos Internacionais</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Turismos Internacionais</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">Início</a>
        <a class="nav-link" href="index.html#destinos">Lugares</a>
        <a class="nav-link" href="index.html#faq">Perguntas Frequentes</a>
        <a class="nav-link" href="sobre.html">Sobre</a>
        <a class="nav-link" href="contato.html">Contato</a>
      </div>
    </div>
  </nav>

  <!-- Contato -->
  <section class="container my-5">
    <h2 class="text-center mb-3">Fale com a gente</h2>
    <p class="text-center mb-5">Preencha o formulário que respondemos em até 24 horas.</p>

    <div class="row justify-content-center">
      <div class="col-md-6">
        <form>
          <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label for="mensagem" class="form-label">Mensagem</label>
            <textarea class="form-control" id="mensagem" rows="4" required></textarea>
          </div>
          <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEnviado">Enviar mensagem</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Modal confirmação -->
  <div class="modal fade" id="modalEnviado" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Mensagem enviada!</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Recebemos sua mensagem e vamos responder em até 24 horas.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-0">© 2026 Turismos Internacionais – Todos os direitos reservados</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
